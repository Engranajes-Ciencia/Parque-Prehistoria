name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # La app nueva (v2), en pruebas, se publica en /Parque-Prehistoria/v2/ sin tocar la actual.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App nueva (v2)
        working-directory: v2
        run: |
          npm ci
          npm run build
      - run: cp -r v2/dist dist/v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # si tu build sale a otra carpeta, cámbialo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
